<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HFD Card Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a storybook card game, warm and calm, Dixit/Splendor tone.
   IDEA: printed playing cards on a paper table: ivory cards, gold double frame, painted scene, medallion.
   PICTURE: the illustrated cards themselves, large at the top of each step.
   COLOUR and TYPE: ivory paper, gold ornament, purple/green/coral/ink per card type; Newsreader serif titles, Nunito body.
   LAYOUT: one centred column, step track on top, cards in a wrapping row, actions at the bottom. */
:root{color-scheme:light dark;--bg:light-dark(#F3EDE2,#1B1828);--table:light-dark(#E8DECB,#262137);--ink:light-dark(#29234A,#EFE9DA);--soft:light-dark(#655D7C,#B5ADC9);--line:light-dark(#D9CCB2,#3D3656);--field:light-dark(#FFFDF8,#221E33);
--paper:#F6EFE1;--cink:#29234A;--gold:#B8944E;--sc:#6B5BB5;--di:#3F6B52;--to:#B8553E;--tw:#29234A}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,44px)}h2{font-size:clamp(24px,3.6vw,32px)}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px) 64px}
header{text-align:center;margin-bottom:12px}
header p{font-family:Newsreader,Georgia,serif;font-style:italic;color:var(--soft);margin:6px 0 0;font-size:18px}
.track{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.track span{padding:6px 14px;border-radius:99px;background:var(--table);color:var(--soft);font-weight:700;font-size:14px}
.track span.on{background:var(--ink);color:var(--bg)}
.table{background:var(--table);border-radius:28px;padding:clamp(18px,3.5vw,36px)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:22px;align-items:start}
.card{--c:var(--sc);position:relative;width:100%;max-width:330px;margin-inline:auto;border-radius:16px;background:var(--paper);color:var(--cink);border:1.5px solid var(--c);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--gold),0 16px 30px -18px rgba(40,30,20,.55);padding:12px 12px 18px;display:flex;flex-direction:column;gap:8px;text-align:center;font:inherit}
.card.sc{--c:var(--sc)}.card.di{--c:var(--di)}.card.to{--c:var(--to)}.card.cn{--c:var(--tw)}
.art{position:relative;aspect-ratio:1.2;border-radius:10px 10px 5px 5px;margin-bottom:16px}
.pic{position:absolute;inset:0;border-radius:inherit;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pic svg{width:100%;height:100%;display:block}
.gem{position:absolute;left:10px;bottom:-19px;width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--gold);box-shadow:0 0 0 3px var(--paper);display:flex;align-items:center;justify-content:center}
.card h3{font-size:24px;color:var(--cink)}
.card.to h3{color:var(--c)}
.orn{display:flex;align-items:center;justify-content:center;gap:6px}.orn i{height:1px;width:44px;background:var(--gold)}.orn b{width:6px;height:6px;background:var(--c);transform:rotate(45deg)}
.card p{margin:0}
.body{font-size:15px;line-height:1.45;text-wrap:pretty}
.q{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:500;font-size:19px;line-height:1.3;color:var(--c);text-wrap:balance}
.tq{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:19px;line-height:1.3;text-wrap:balance}
.kw{font-size:13px;font-weight:700;color:#655D7C;margin-top:4px!important}
.back{cursor:pointer;background:var(--c);border-color:var(--c);color:var(--paper);box-shadow:inset 0 0 0 8px var(--c),inset 0 0 0 9px var(--gold),inset 0 0 0 13px var(--c),inset 0 0 0 14px var(--gold),0 16px 30px -18px rgba(40,30,20,.55);aspect-ratio:0.72;align-items:center;justify-content:center;gap:14px}
.back .med{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);box-shadow:inset 0 0 0 5px var(--c),inset 0 0 0 6px var(--gold);display:flex;align-items:center;justify-content:center}
.back .nm{font-family:Newsreader,Georgia,serif;font-size:30px;font-weight:600}
.back .tp{font-size:14px;font-weight:700;opacity:.9}
.back:hover{transform:translateY(-3px)}
.flip{animation:flip .45s ease}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.flip{animation:none}.back:hover,.pick:hover{transform:none}}
.pick{cursor:pointer;transition:transform .15s,outline-color .15s;outline:3px solid transparent;outline-offset:5px}
.pick:hover{transform:translateY(-3px)}
.pick.sel{outline-color:var(--gold)}
.who{font-size:13px;font-weight:800;color:var(--soft);text-align:center}
.card .who{color:#655D7C;margin-bottom:2px}
.note{font-style:italic;color:var(--cink);opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
button{font:inherit;font-weight:800;min-height:44px;padding:10px 20px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.main{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.4;cursor:not-allowed}
button.sm{min-height:36px;padding:6px 14px;font-size:14px;border-color:var(--line)}
button.card{min-height:0;padding:12px;border-radius:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible,.pick:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
label{display:block;font-weight:700;margin:16px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.players{display:grid;gap:10px;max-width:460px;margin:0 auto}
.pl{display:flex;gap:8px;align-items:center}.pl input{flex:1}
.lead{text-align:center;margin-bottom:20px}
.lead p{color:var(--soft);margin:6px 0 0}
.bridge{text-align:center;margin:20px auto 0;max-width:620px;font-family:Newsreader,Georgia,serif;font-style:italic;font-size:20px}
.pass{text-align:center;padding:40px 10px}
.pass h2{font-size:clamp(30px,5vw,46px);margin:8px 0 14px}
.form{max-width:620px;margin:0 auto}
.sum{background:var(--paper);color:var(--cink);border-radius:18px;padding:24px;border:1.5px solid var(--gold)}
.sum dt{font-weight:800;color:#655D7C;font-size:14px;margin-top:14px}
.sum dd{margin:2px 0 0}
.hint{text-align:center;color:var(--soft);font-size:14px;margin-top:12px}
.timer{font:600 40px Newsreader,Georgia,serif;text-align:center;margin-top:14px}
.qs{background:var(--paper);color:var(--cink);border:1.5px solid var(--gold);border-radius:18px;padding:20px 22px;max-width:640px;margin:22px auto 0;text-align:center}
.qs p{margin:4px 0}.qk{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#655D7C}
.qq{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:22px;line-height:1.3;color:var(--di);margin-top:10px!important;text-wrap:balance}
.qr{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:26px;color:var(--to);margin-top:8px!important}
.tbox{text-align:center;margin-top:18px}.tlabel{font-size:13px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.tbox .timer{margin:2px 0 6px}
.votes{display:grid;gap:10px;max-width:460px;margin:20px auto 0}
.vote{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.seg{display:flex;gap:6px}.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini{background:var(--paper);color:var(--cink);border-radius:14px;padding:12px 14px;border:1.5px solid var(--to);font-size:15px}
.mini span{display:block;font-style:italic;margin-top:4px}
.how{background:var(--paper);color:var(--cink);border-radius:18px;padding:22px 24px;max-width:680px;margin:24px auto 0;border:1.5px solid var(--gold)}
.how h3{font-size:22px;margin:4px 0 8px}.how h3+ol{margin-top:0}.how ol{padding-left:22px}.how li{margin:6px 0}
.how dt{font-weight:800;color:#655D7C;font-size:14px;margin-top:10px}.how dd{margin:2px 0 0}
footer{text-align:center;color:var(--soft);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Human-Focused Design Card Game</h1>
  <p>Conditions, not answers.</p>
</header>
<nav class="track" id="track"></nav>
<main class="table" id="app"></main>
<footer>Pass one device around the table. Nothing is saved or sent anywhere.</footer>
</div>
<script>
{
const SCEN=[["The Upside-Down City", "Everything here is upside down. A magic robot helps everyone."], ["Dragon School", "Young dragons learn to fly and breathe fire. An AI teacher helps."], ["The Toy Hospital", "Broken toys come here to be fixed. A clever robot can fix almost anything."], ["The Underwater Kingdom", "Mermaids and sea creatures live together. A smart machine runs the kingdom."], ["The Never-Ending Funfair", "A robot knows exactly what makes every visitor happy."], ["The Moon Village", "Aliens of every shape are building a village with AI."], ["The Cloud Bakery", "Bread floats on fluffy clouds. A robot baker makes a perfect loaf every time."], ["The Jungle Library", "Books grow on trees. A robot librarian knows what everyone should read."], ["The Snow Post Office", "Letters travel by sledge. A robot writes and delivers them all."], ["The Giant's Garden", "Vegetables grow as big as houses. A robot gardener does all the watering."], ["The Pirate Ship", "A crew sails the seven seas. A robot navigator always knows the way."], ["The Music Mountain", "Every rock sings a note. A robot can play any song perfectly."], ["The Sleepy Forest", "The animals sleep all winter. A robot looks after the forest for them."]];
const DIL=[["The Dragon Who Can't Breathe Fire", "One dragon can only blow bubbles. The AI can give her a special lesson, but she'd learn alone.", "Her own way alone, or the same way together?"], ["The Perfect Painting", "A magic brush fixes every mistake. If your painting wins, your class gets a trip.", "Use the brush, or keep your mistakes?"], ["The Broken Castle", "A robot knocked down the children's castle. It was following one child's instructions.", "Who should rebuild it? Is the robot responsible?"], ["The Happiness Bubbles", "A robot gives each child a perfect bubble world. One lonely child loves hers.", "Stay in the bubble, or come out to play?"], ["The Birthday Surprise", "A robot can plan the perfect party. But the child wanted friends to plan it, and last year they forgot.", "A perfect party, or one made with care?"], ["The Shortcut Spell", "A robot knows a shortcut past the hard parts. One friend is very tired.", "Take the shortcut, or keep the adventure?"], ["The Thank-You Letter", "A robot can write a perfect thank-you letter to your grandma. Your handwriting is very messy.", "The robot's perfect letter, or your messy one?"], ["The Team Picker", "A robot picks perfectly fair teams at break time. But best friends end up on different sides.", "Fair teams from the robot, or choose for yourselves?"], ["The Secret Diary", "A robot could read your diary to know when you are sad, and cheer you up.", "Should the robot read it to help you?"], ["The Lost Puppy", "A robot can find the lost puppy in one minute. The children made posters to search together.", "Let the robot find it, or search together?"], ["The Homework Helper", "A robot gives you the answer the moment you are stuck. You would finish fast, but might not learn.", "Ask the robot, or stay stuck a little longer?"], ["The Translator Hat", "A magic hat lets a new classmate talk to everyone at once. But nobody would learn her language.", "Wear the hat, or learn each other's words?"], ["The Wilting Plant", "A robot can make the class garden perfect. One plant the children grew themselves is wilting.", "Let the robot save it, or look after it yourselves?"]];
const TOOLS=[["My Way", "Subjectivity", "If the robot does it for you, is it still yours?"], ["Who Decides?", "Boundary", "What should the robot decide, and what should people decide?"], ["Answer For It", "Responsibility", "Who will answer for this choice: the robot or us?"], ["Together", "Shared", "Does the robot's help bring people together, or keep them apart?"], ["Leave a Mark", "Patina", "If the robot makes it spotless, what marks of people would be lost?"], ["No Thanks", "Choice", "Can people say “no thanks” to the robot's help?"], ["In Their Shoes", "Empathy", "Who in the story might the robot not notice? How do they feel?"], ["Oops Is OK", "Imperfection", "What good thing could come from getting it wrong?"], ["Lend a Hand", "Care", "Who could the robot help that people might leave behind?"], ["Ask First", "Consent", "Did everyone agree to the robot's help?"], ["The Next Day", "Consequence", "What happens if the robot does this every single day?"], ["Learn It", "Growth", "What will people still know how to do without the robot?"], ["Fair for All", "Fairness", "Is the robot's help fair to everyone, or only to some?"]];
const CONS=[["Only One", "You must pick one side. No mixing, no “both”!"], ["One Wish", "The robot can only help one time. Where should it help?"], ["Someone Is Sad", "Whatever you choose, one character will be sad. Say who."], ["Not Here", "The character isn't here to choose. Decide for them. Would they agree?"], ["Everyone Agrees", "No voting. Everyone must agree before you finish."], ["Hurry Up!", "The robot says: decide in 2 minutes! Can you still listen to everyone?", 120], ["Swap Sides", "Before you decide, argue for the side you did not choose."], ["Robot Breaks", "The robot stops working halfway. What happens now?"], ["Youngest Decides", "The youngest player has the final say. Everyone else can only advise."], ["Ask the Character", "One player becomes the main character. Ask how they feel first."], ["Secret Vote", "Vote in secret first, then talk. Did anyone change their mind?"], ["Every Day", "Your decision becomes a rule for every day, not just today."], ["Someone New", "A new character arrives and disagrees with you. Listen to them."]];
const STEPS=["Players","Draw","First choice","Twist","Tool cards","Solutions","Decide","Reflect"];
const REFLECT="Who might feel most uncomfortable with this decision, and why?";
const REFLECT2="Did the robot skip anything that people should do themselves?";

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let S={players:["Player 1","Player 2","Player 3","Player 4"],step:0,how:false};
function reset(){stop();Object.assign(S,{step:1,scen:null,dil:null,con:null,tm:{},turn:0,shown:false,hands:[],chosen:[],notes:[],sel:null,sp:0,gut:[],gut2:[],decision:"",robot:"",kept:"",r2:"",gave:"",reflect:""})}

/* one timer at a time; each step keeps its own remaining seconds */
let tick=null,tkey=null;
function stop(){clearInterval(tick);tick=null;tkey=null}
function timer(key,secs,label){const left=S.tm[key]??secs;return `<div class="tbox"><div class="tlabel">${label}</div><div class="timer" id="tm">${left?fmt(left):"Time's up!"}</div><button class="sm" id="ts">${tkey===key?"Pause":left<secs?"Resume":"Start "+fmt(secs)+" timer"}</button></div>`}
function bindTimer(key,secs){const b=$("#ts");if(!b)return;b.onclick=()=>{if(tkey===key){stop();b.textContent="Resume";return}
  stop();S.tm[key]=S.tm[key]??secs;if(!S.tm[key])S.tm[key]=secs;tkey=key;b.textContent="Pause";
  tick=setInterval(()=>{S.tm[key]=Math.max(0,S.tm[key]-1);const t=$("#tm");if(t)t.textContent=S.tm[key]?fmt(S.tm[key]):"Time's up!";if(!S.tm[key]){stop();const bb=$("#ts");if(bb)bb.textContent="Start again"}},1000)}}
function go(n){stop();S.step=n;render()}

function track(){$("#track").innerHTML=STEPS.map((t,i)=>`<span class="${i===S.step?"on":""}">${t}</span>`).join("")}
/* the one sentence that ties the cards together */
const question=()=>`<div class="qs"><div class="qk">The question</div><p>In <b>${esc(S.scen[0])}</b>: ${esc(S.dil[1])}</p><p class="qq">${esc(S.dil[2])}</p><p class="qr">Robot or me?</p></div>`;
const tally=g=>{const r=g.filter(x=>x==="robot").length,m=g.filter(x=>x==="me").length;return `Robot ${r} · Me ${m}`};
function choices(arr){return `<div class="votes">${S.players.map((p,i)=>`<div class="vote"><span>${esc(p)}</span><div class="seg" role="group" aria-label="${esc(p)}'s choice"><button class="sm ${arr[i]==="robot"?"on":""}" data-v="robot" data-i="${i}" aria-pressed="${arr[i]==="robot"}">Robot</button><button class="sm ${arr[i]==="me"?"on":""}" data-v="me" data-i="${i}" aria-pressed="${arr[i]==="me"}">Me</button></div></div>`).join("")}</div>`}
function bindChoices(arr){document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{arr[+b.dataset.i]=b.dataset.v;render()})}

const HOW=`<div class="how">
<h3>How a round works</h3>
<ol>
<li><b>Draw</b> a scenario and a dilemma. The scenario is <i>where</i>. The dilemma is <i>what happens</i>. Read them as one question.</li>
<li><b>First choice</b>: everyone says Robot or Me. Just your gut. 1 minute.</li>
<li><b>Twist</b>: draw a twist card. Does it change your mind?</li>
<li><b>Tool cards</b>: each player gets 2 tool cards and keeps 1, in secret.</li>
<li><b>Solutions</b>: take turns. Use your card to say your own solution. 1 minute each.</li>
<li><b>Decide</b> together: what does the robot do, and what do people still do? 3 minutes.</li>
</ol>
<p>One scenario is one round. Next round, draw new cards.</p>
<h3>Example round</h3>
<dl>
<dt>The question</dt><dd>In <b>The Giant's Garden</b>: a plant the children grew themselves is wilting. Let the robot save it, or look after it yourselves?</dd>
<dt>First choice</dt><dd>Robot 3 · Me 1</dd>
<dt>Twist</dt><dd>Every Day: your decision becomes a rule for every day.</dd>
<dt>Tool card</dt><dd>Mia keeps <b>Leave a Mark</b>: “If the robot makes it spotless, what marks of people would be lost?”</dd>
<dt>Mia's solution</dt><dd>“The robot can check the soil. But we water the plant ourselves, or it's not our garden.”</dd>
<dt>Decision</dt><dd>The robot checks the soil every morning. The children water and care for the plant. We gave up a perfect garden.</dd>

 stroke=\"#4A4466\" stroke-width=\"3.4\" stroke-linecap=\"round\"></path><path d=\"M-7 -21 l-4 9 M7 -21 l4 9\" stroke=\"#8D5A3B\" stroke-width=\"3.2\" stroke-linecap=\"round\"></path><path d=\"M-8 -12 q-1 -12 3 -14 h10 q4 2 3 14 z\" fill=\"#E07A5F\"></path><circle cx=\"0\" cy=\"-36\" r=\"8.5\" fill=\"#8D5A3B\"></circle><path d=\"M-9 -37 q0 -11 9 -10.5 q9 -0.5 9 10.5 q-3 -6 -9 -6 q-6 0 -9 6 z\" fill=\"#1E1A2E\"></path><circle cx=\"-3.2\" cy=\"-36\" r=\"1.2\" fill=\"#29234A\"></circle><circle cx=\"3.2\" cy=\"-36\" r=\"1.2\" fill=\"#29234A\"></circle><path d=\"M-2.5 -33 q2.5 2.2 5 0\" stroke=\"#7A3B2E\" stroke-width=\"1\" fill=\"none\"></path></g><g transform=\"translate(46 132) scale(0.95)\"><ellipse cx=\"0\" cy=\"0\" rx=\"10\" ry=\"2.4\" fill=\"#29234A\" opacity=\"0.12\"></ellipse><path d=\"M-4 -12 v12 M4 -12 v12\" stroke=\"#4A4466\" stroke-width=\"3.4\" stroke-linecap=\"round\"></path><path d=\"M-7 -21 l-4 9 M7 -21 l4 9\" stroke=\"#E3B08A\" stroke-width=\"3.2\" stroke-linecap=\"round\"></path><path d=\"M-8 -12 q-1 -12 3 -14 h10 q4 2 3 14 z\" fill=\"#A9C9A0\"></path><circle cx=\"0\" cy=\"-36\" r=\"8.5\" fill=\"#E3B08A\"></circle><path d=\"M-9 -37 q0 -11 9 -10.5 q9 -0.5 9 10.5 q-3 -6 -9 -6 q-6 0 -9 6 z\" fill=\"#6B4A2E\"></path><circle cx=\"-3.2\" cy=\"-36\" r=\"1.2\" fill=\"#29234A\"></circle><circle cx=\"3.2\" cy=\"-36\" r=\"1.2\" fill=\"#29234A\"></circle><ellipse cx=\"0\" cy=\"-32.5\" rx=\"1.6\" ry=\"2\" fill=\"#7A3B2E\"></ellipse></g><g transform=\"translate(90 132) scale(0.95)\"><ellipse cx=\"0\" cy=\"0\" rx=\"10\" ry=\"2.4\" fill=\"#29234A\" opacity=\"0.12\"></ellipse><path d=\"M-4 -12 v12 M4 -12 v12\" stroke=\"#4A4466\" stroke-width=\"3.4\" stroke-linecap=\"round\"></path><path d=\"M-7 -21 l-4 9 M7 -21 l4 9\" stroke=\"#C98E66\" stroke-width=\"3.2\" stroke-linecap=\"round\"></path><path d=\"M-8 -12 q-1 -12 3 -14 h10 q4 2 3 14 z\" fill=\"#C7B6EA\"></path><circle cx=\"0\" cy=\"-36\" r=\"8.5\" fill=\"#C98E66\"></circle><path d=\"M-9 -37 q0 -11 9 -10.5 q9 -0.5 9 10.5 q-3 -6 -9 -6 q-6 0 -9 6 z\" fill=\"#D9A441\"></path><circle cx=\"-3.2\" cy=\"-36\" r=\"1.2\" fill=\"#29234A\"></circle><circle cx=\"3.2\" cy=\"-36\" r=\"1.2\" fill=\"#29234A\"></circle><path d=\"M-2.5 -31.5 q2.5 -2 5 0\" stroke=\"#7A3B2E\" stroke-width=\"1\" fill=\"none\"></path></g><rect y=\"-28\" width=\"200\" height=\"168\" filter=\"url(#sng)\" opacity=\"0.22\"></rect></svg>"};
const ICONS={"sc": "<circle cx=\"12\" cy=\"12\" r=\"8\"/><ellipse cx=\"12\" cy=\"12\" rx=\"3.5\" ry=\"8\"/><path d=\"M4 12h16\"/>", "di": "<path d=\"M12 21v-7\"/><path d=\"M12 14L6 6\"/><path d=\"M12 14l6-8\"/><path d=\"M6 10V6h4\"/><path d=\"M18 10V6h-4\"/>", "to": "<circle cx=\"10.5\" cy=\"10.5\" r=\"6\"/><path d=\"M15 15l5 5\"/>", "tw": "<path d=\"M20 12a8 8 0 1 1-3-6.2\"/><path d=\"M17 3v3h-3\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/>"};
const ic=(k,c,n)=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const art=(k,t)=>`<div class="art"><div class="pic">${ART[t]||""}</div><div class="gem">${ic(k,"#ffffff",20)}</div></div>`;
const orn='<div class="orn"><i></i><b></b><i></i></div>';
const scCard=c=>`<div class="card sc flip">${art("sc",c[0])}<h3>${esc(c[0])}</h3>${orn}<p class="body">${esc(c[1])}</p></div>`;
const diCard=c=>`<div class="card di flip">${art("di",c[0])}<h3>${esc(c[0])}</h3><p class="body">${esc(c[1])}</p>${orn}<p class="q">${esc(c[2])}</p></div>`;
const cnCard=c=>`<div class="card cn flip">${art("tw",c[0])}<h3>${esc(c[0])}</h3>${orn}<p class="tq">${esc(c[1])}</p></div>`;
const toInner=c=>`${art("to",c[0])}<h3>${esc(c[0])}</h3>${orn}<p class="tq">${esc(c[2])}</p><p class="kw">Keyword · ${esc(c[1])}</p>`;
const BK={scenario:["sc","Scenario"],dilemma:["di","Dilemma"],twist:["cn","Twist"]};
const backCard=(k,id)=>{const [cl,nm]=BK[k];return `<button class="card back ${cl}" id="${id}"><span class="med">${ic(cl==="cn"?"tw":cl,"#F6EFE1",46)}</span><span class="nm">${nm}</span><span class="tp">Tap to draw</span></button>`};

function render(){
  track();const a=$("#app");
  if(S.step===0){
    a.innerHTML=`<div class="lead"><h2>Who is playing?</h2><p>2 to 6 players. Pass one device around.</p></div>
    <div class="players">${S.players.map((p,i)=>`<div class="pl"><input id="p${i}" value="${esc(p)}" aria-label="Player ${i+1} name"><button class="sm" data-rm="${i}" ${S.players.length<=2?"disabled":""}>Remove</button></div>`).join("")}</div>
    <div class="bar"><button id="add" ${S.players.length>=6?"disabled":""}>Add player</button><button id="howb" aria-expanded="${S.how}">${S.how?"Hide":"How to play"}</button><button class="main" id="go">Start the round</button></div>
    ${S.how?HOW:""}`;
    a.querySelectorAll(".players input").forEach((el,i)=>el.oninput=()=>S.players[i]=el.value);
    a.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.players.splice(+b.dataset.rm,1);render()});
    $("#add").onclick=()=>{S.players.push("Player "+(S.players.length+1));render()};
    $("#howb").onclick=()=>{S.how=!S.how;render()};
    $("#go").onclick=()=>{S.players=S.players.map((p,i)=>p.trim()||"Player "+(i+1));reset();render()};
  }
  else if(S.step===1){
    const both=S.scen&&S.dil;
    a.innerHTML=`<div class="lead"><h2>Draw the question</h2><p>The scenario is <b>where</b>. The dilemma is <b>what happens</b>.</p></div>
    <div class="row" style="max-width:700px;margin:0 auto">${S.scen?scCard(S.scen):backCard("scenario","drs")}${S.dil?diCard(S.dil):backCard("dilemma","drd")}</div>
    ${both?question()+`<p class="bridge">Imagine it happening in ${esc(S.scen[0])}. Who is there? What does it look like?</p>`+timer("read",60,"Read and imagine"):""}
    <div class="bar">${both?`<button id="rs">New scenario</button><button id="rd">New dilemma</button><button class="main" id="next">Next: first choice</button>`:""}</div>`;
    if($("#drs"))$("#drs").onclick=()=>{S.scen=rnd(SCEN);render()};
    if($("#drd"))$("#drd").onclick=()=>{S.dil=rnd(DIL);render()};
    if(both){$("#rs").onclick=()=>{S.scen=rnd(SCEN.filter(x=>x!==S.scen));render()};$("#rd").onclick=()=>{S.dil=rnd(DIL.filter(x=>x!==S.dil));render()};
      bindTimer("read",60);$("#next").onclick=()=>go(2)}
  }
  else if(S.step===2){
    const done=S.gut.filter(Boolean).length===S.players.length;
    a.innerHTML=`<div class="lead"><h2>First choice</h2><p>Don't think too long. Robot or me?</p></div>
    ${question()}${choices(S.gut)}${timer("gut",60,"Gut feeling")}
    ${done?`<p class="bridge">${tally(S.gut)}</p>`:`<p class="hint">Everyone picks one.</p>`}
    <div class="bar"><button class="main" id="next" ${done?"":"disabled"}>Next: the twist</button></div>`;
    bindChoices(S.gut);bindTimer("gut",60);$("#next").onclick=()=>{S.gut2=S.gut.slice();go(3)};
  }
  else if(S.step===3){
    a.innerHTML=`<div class="lead"><h2>The twist</h2><p>Something changes. Does it change your mind?</p></div>
    <div class="row" style="max-width:700px;margin:0 auto">${diCard(S.dil)}${S.con?cnCard(S.con):backCard("twist","drc")}</div>
    ${S.con?`<p class="bridge">Before the twist: ${tally(S.gut)}. Change your choice if you want.</p>${choices(S.gut2)}`:""}
    <div class="bar">${S.con?`<button id="rc">Draw another twist</button><button class="main" id="next">Next: tool cards</button>`:""}</div>`;
    if(!S.con)$("#drc").onclick=()=>{S.con=rnd(CONS);render()};
    else{bindChoices(S.gut2);$("#rc").onclick=()=>{S.con=rnd(CONS.filter(x=>x!==S.con));render()};$("#next").onclick=()=>{deal();go(4)}}
  }
  else if(S.step===4){
    const p=S.players[S.turn];
    if(!S.shown){
      a.innerHTML=`<div class="pass"><div class="who">Turn ${S.turn+1} of ${S.players.length}</div><h2>Pass to ${esc(p)}</h2><p style="color:var(--soft)">Others, look away. You get 2 tool cards. Keep 1.</p><div class="bar"><button class="main" id="show">I'm ${esc(p)}, show my cards</button></div></div>`;
      $("#show").onclick=()=>{S.shown=true;S.sel=null;render()};
    }else{
      const h=S.hands[S.turn];
      a.innerHTML=`<div class="lead"><h2>${esc(p)}, keep one tool card</h2><p>Which card helps you answer the question?</p></div>
      <div class="row">${h.map((c,i)=>`<div role="button" tabindex="0" data-i="${i}" class="card to pick flip ${S.sel===i?"sel":""}">${toInner(c)}</div>`).join("")}</div>
      <p class="hint">${esc(S.dil[2])} Twist: ${esc(S.con[1])}</p>
      <div class="bar"><button class="main" id="done" ${S.sel===null?"disabled":""}>Keep this card</button></div>`;
      a.querySelectorAll(".pick").forEach(el=>{const f=()=>{S.sel=+el.dataset.i;render()};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
      $("#done").onclick=()=>{S.chosen[S.turn]=h[S.sel];S.turn++;S.shown=false;if(S.turn>=S.players.length){S.sp=0;go(5)}else render()};
    }
  }
  else if(S.step===5){
    const i=S.sp,p=S.players[i],last=i>=S.players.length-1,k="sol"+i;
    a.innerHTML=`<div class="lead"><div class="who">Solution ${i+1} of ${S.players.length}</div><h2>${esc(p)}, your solution</h2><p>Show your card. Then finish the sentence.</p></div>
    <div class="row" style="max-width:700px;margin:0 auto"><div class="card to flip">${toInner(S.chosen[i])}</div>${cnCard(S.con)}</div>
    <p class="bridge">“My card asks… So I think the robot should ___, and people should ___.”</p>
    ${timer(k,60,"1 minute to talk")}
    <div class="form"><label for="note">Write it down (optional)</label><textarea id="note" placeholder="The robot should… People should…">${esc(S.notes[i]||"")}</textarea></div>
    <div class="bar">${i>0?`<button id="prev">Back</button>`:""}<button class="main" id="next">${last?"Next: decide together":"Next player"}</button></div>`;
    $("#note").oninput=e=>S.notes[i]=e.target.value;bindTimer(k,60);
    if($("#prev"))$("#prev").onclick=()=>{stop();S.sp--;render()};
    $("#next").onclick=()=>{if(last)go(6);else{stop();S.sp++;render()}};
  }
  else if(S.step===6){
    const secs=S.con[2]||180;
    a.innerHTML=`<div class="lead"><h2>Decide together</h2><p>Mix the best ideas. What does the robot do, and what stays with people?</p></div>
    ${question()}
    <div class="row" style="margin-top:6px">${S.players.map((p,i)=>`<div class="mini"><b>${esc(p)}</b> · ${esc(S.chosen[i][0])}${S.notes[i]?`<span>“${esc(S.notes[i])}”</span>`:""}</div>`).join("")}</div>
    <p class="hint">Twist: ${esc(S.con[0])}. ${esc(S.con[1])}</p>
    ${timer("dec",secs,S.con[2]?"Hurry up!":"3 minutes to decide")}
    <div class="form"><label for="d">Our decision</label><textarea id="d">${esc(S.decision)}</textarea>
    <label for="rb">What the robot will do</label><input id="rb" value="${esc(S.robot)}">
    <label for="k">What people will still do themselves</label><input id="k" value="${esc(S.kept)}">
    <label for="g">What we gave up</label><input id="g" value="${esc(S.gave)}"></div>
    <p class="hint">Every choice gives something up. Name it.</p>
    <div class="bar"><button class="main" id="next">Next: reflect</button></div>`;
    $("#d").oninput=e=>S.decision=e.target.value;$("#rb").oninput=e=>S.robot=e.target.value;$("#k").oninput=e=>S.kept=e.target.value;$("#g").oninput=e=>S.gave=e.target.value;
    bindTimer("dec",secs);$("#next").onclick=()=>go(7);
  }
  else if(S.step===7){
    a.innerHTML=`<div class="lead"><h2>Reflect</h2><p>Two last questions.</p></div>
    <div class="form"><label for="r">${REFLECT}</label><textarea id="r">${esc(S.reflect)}</textarea>
    <label for="r2">${REFLECT2}</label><textarea id="r2">${esc(S.r2)}</textarea></div>
    <div class="sum" style="margin-top:22px"><h3>Round summary</h3><dl>
      <dt>Question</dt><dd>${esc(S.scen[0])} · ${esc(S.dil[0])}: ${esc(S.dil[2])}</dd>
      <dt>First choice</dt><dd>${tally(S.gut)}</dd>
      <dt>Twist</dt><dd>${esc(S.con[0])}: ${esc(S.con[1])} → ${tally(S.gut2)}</dd>
      <dt>Tool cards</dt><dd>${S.players.map((p,i)=>`${esc(p)}: ${esc(S.chosen[i][0])}`).join(" · ")}</dd>
      <dt>Decision</dt><dd>${esc(S.decision)||"Not written"}</dd>
      <dt>Robot does</dt><dd>${esc(S.robot)||"Not written"}</dd>
      <dt>People do</dt><dd>${esc(S.kept)||"Not written"}</dd>
      <dt>Gave up</dt><dd>${esc(S.gave)||"Not written"}</dd></dl></div>
    <div class="bar"><button id="copy">Copy summary</button><button id="players">Change players</button><button class="main" id="again">New round, new cards</button></div>
    <p class="hint" id="msg" aria-live="polite"></p>`;
    $("#r").oninput=e=>S.reflect=e.target.value;$("#r2").oninput=e=>S.r2=e.target.value;
    $("#copy").onclick=async()=>{const t=`Question: ${S.scen[0]} / ${S.dil[0]} (${S.dil[2]})\nFirst choice: ${tally(S.gut)}\nTwist: ${S.con[0]} → ${tally(S.gut2)}\nTool cards: ${S.players.map((p,i)=>p+": "+S.chosen[i][0]).join(", ")}\nDecision: ${S.decision}\nRobot does: ${S.robot}\nPeople do: ${S.kept}\nGave up: ${S.gave}\n${REFLECT} ${S.reflect}\n${REFLECT2} ${S.r2}`;
      try{await navigator.clipboard.writeText(t);$("#msg").textContent="Copied."}catch(e){$("#msg").textContent="Copy is blocked here. Select the summary and copy it by hand."}};
    $("#players").onclick=()=>go(0);
    $("#again").onclick=()=>{reset();render()};
  }
  window.scrollTo({top:0});
}
function deal(){
  let deck=shuffle(TOOLS);S.hands=S.players.map(()=>{if(deck.length<2)deck=shuffle(TOOLS);return[deck.pop(),deck.pop()]});
  S.turn=0;S.shown=false;S.chosen=[];S.notes=[];
}
render();
}
</script>
</body>
</html>
